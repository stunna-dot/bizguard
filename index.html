<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BizGuard — see how your Grab store is really doing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3f5f0; --surface:#ffffff; --surface2:#f3f5f0; --ink:#0e2420; --muted:#52635e; --line:#dfe4de;
  --accent:#0f5c4b; --mint:#e1eee8; --field:#ffffff; --field-line:#8a9692; --bar:#0f5c4b; --track:#e3e8e2;
  --warn-bg:#fde9c3; --warn-ink:#5d4000; --red:#a63a1a;
  --g900:#0a3b32; --g700:#0f5c4b; --yellow:#f2b13e;
  --display:'Bricolage Grotesque','Segoe UI','Helvetica Neue',Arial,sans-serif;
  --body:'Figtree','Segoe UI','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1512; --surface:#12221d; --surface2:#1a2e28; --ink:#eaf2ee; --muted:#9db0a9; --line:#26413a;
    --accent:#5fd0aa; --mint:#1d3a32; --field:#0f1d19; --field-line:#5d746c; --bar:#1f8a6e; --track:#25403a;
    --warn-bg:#3d3012; --warn-ink:#f6d98f; --red:#ff8f6b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1512; --surface:#12221d; --surface2:#1a2e28; --ink:#eaf2ee; --muted:#9db0a9; --line:#26413a;
  --accent:#5fd0aa; --mint:#1d3a32; --field:#0f1d19; --field-line:#5d746c; --bar:#1f8a6e; --track:#25403a;
  --warn-bg:#3d3012; --warn-ink:#f6d98f; --red:#ff8f6b; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth;background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:800;letter-spacing:-.015em;line-height:1.08;margin:0}
p{margin:0}
a{color:inherit}
button{font:inherit;cursor:pointer}
svg{display:block}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:6px}
.container{max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,48px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid transparent;border-radius:12px;padding:12px 20px;font-weight:700;font-size:16px;text-decoration:none;line-height:1.2;transition:filter .15s,background .15s}
.btn:hover{filter:brightness(1.08)}
.btn-yellow{background:var(--yellow);color:#1a1405}
.btn-green{background:var(--g700);color:#fff}
.btn-outline{background:transparent;color:var(--ink);border-color:var(--field-line)}
.btn-outline:hover{background:var(--surface2);filter:none}
.btn-light{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.btn-light:hover{background:rgba(255,255,255,.1);filter:none}
.btn-lg{padding:16px 24px;border-radius:14px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link-u{font-weight:700;text-decoration:underline;text-underline-offset:4px}

.logo{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px;color:#fff;text-decoration:none;letter-spacing:-.01em}
.logo .ic{width:26px;height:26px;stroke:var(--yellow)}
.pubnav{display:flex;align-items:center;justify-content:space-between;padding:26px 0;gap:16px}
.pubnav nav{display:flex;align-items:center;gap:28px;color:#fff;font-weight:600;font-size:15px}
.pubnav nav a{text-decoration:none}
.pubnav nav a:not(.btn):hover{text-decoration:underline;text-underline-offset:5px}
.pubnav nav .btn{padding:10px 18px;font-size:15px;color:#1a1405}
.app-header{background:var(--g900);color:#fff}
.app-header .container{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px}
.app-header nav{display:flex;align-items:stretch;gap:6px;overflow-x:auto;scrollbar-width:none}
.app-header nav::-webkit-scrollbar{display:none}
.app-header nav a{color:#d3e4de;text-decoration:none;font-weight:600;font-size:15px;padding:12px 14px;border-radius:10px 10px 0 0;white-space:nowrap}
.app-header nav a:hover{color:#fff}
.app-header nav a[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 -3px 0 var(--yellow)}
.app-header .btn{padding:9px 16px;font-size:15px;flex:none}
.app-header .left{display:flex;align-items:center;gap:24px;min-width:0}
.badge-admin{background:var(--yellow);color:#1a1405;font-weight:800;font-size:12px;letter-spacing:.06em;padding:4px 10px;border-radius:8px;margin-left:4px}
.admin-who{display:flex;align-items:center;gap:14px;font-size:15px;color:#d3e4de}

.hero{background-color:var(--g900);background-image:radial-gradient(rgba(255,255,255,.08) 1.2px,transparent 1.5px);background-size:26px 26px;color:#fff;padding-bottom:clamp(48px,8vw,96px)}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(32px,5vw,72px);align-items:center;padding-top:clamp(16px,3vw,40px)}
.pill{display:inline-block;background:rgba(255,255,255,.1);color:#fff;font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:999px;margin-bottom:26px}
.hero h1{font-size:clamp(42px,6.4vw,72px);line-height:1;letter-spacing:-.025em}
.hero h1 .y{color:var(--yellow);display:block}
.hero .lead{font-size:18px;line-height:1.55;color:#d3e4de;max-width:34em;margin:26px 0 34px}
.hero .cta{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.hero .cta .link-u{color:#fff}
.sample{background:var(--surface);color:var(--ink);border-radius:28px;padding:24px;box-shadow:0 30px 60px rgba(0,0,0,.28)}
.sample-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.sample-head h3{font-family:var(--body);font-size:17px;font-weight:700;letter-spacing:0}
.tag{display:inline-block;background:var(--mint);color:var(--accent);font-size:11.5px;font-weight:800;letter-spacing:.07em;padding:5px 10px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn-ink)}
.tag.dark{background:rgba(255,255,255,.14);color:#fff}
.mini-kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini-kpi{background:var(--surface2);border-radius:16px;padding:14px 16px}
.mini-kpi small{display:block;color:var(--muted);font-size:13.5px}
.mini-kpi b{display:block;font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.mini-kpi span{font-size:13px;font-weight:700;color:var(--accent)}
.bars{display:flex;align-items:flex-end;gap:12px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0}
.bar{width:100%;border-radius:8px 8px 4px 4px;background:var(--bar)}
.bar.hi{background:var(--yellow)}
.bar-lbl{font-size:13px;color:var(--muted);margin-top:8px}
.bar-lbl.hi{color:var(--ink);font-weight:800}
.alert-bar{display:flex;align-items:center;gap:10px;background:var(--warn-bg);color:var(--warn-ink);font-weight:600;font-size:14.5px;border-radius:12px;padding:12px 14px;margin-top:16px}
.sec{padding:clamp(56px,8vw,96px) 0}
.sec.white{background:var(--surface)}
.sec.line-t{border-top:1px solid var(--line)}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.sec h2{font-size:clamp(32px,4.4vw,48px);max-width:12em;letter-spacing:-.02em}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:48px}
.step{border-top:2px solid var(--ink);padding-top:22px}
.step .n{font-family:var(--display);font-size:52px;font-weight:800;color:var(--accent);line-height:1}
.step h3{font-family:var(--body);font-size:19px;font-weight:700;letter-spacing:0;margin:16px 0 8px}
.step p{color:var(--muted)}
.feats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px}
.feat{background:var(--surface2);border-radius:20px;padding:22px}
.feat .ico{width:40px;height:40px;background:var(--g700);color:#fff;border-radius:10px;display:grid;place-items:center;margin-bottom:34px}
.feat h3{font-family:var(--body);font-size:18px;font-weight:700;letter-spacing:0;margin-bottom:6px}
.feat p{color:var(--muted);font-size:15.5px}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px}
.tool{display:block;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;text-decoration:none;transition:border-color .15s}
.tool:hover{border-color:var(--accent)}
.tool small{display:block;font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.tool b{font-family:var(--display);font-size:22px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
.cta-band{background:var(--g700);color:#fff;border-radius:28px;padding:clamp(28px,5vw,56px);display:flex;align-items:center;justify-content:space-between;gap:32px;flex-wrap:wrap;margin-top:64px}
.cta-band h2{font-size:clamp(28px,3.6vw,40px);max-width:none}
.cta-band p{color:#d3e4de;max-width:30em;margin:14px 0 14px}
.cta-band .contact{font-weight:700;display:flex;gap:22px;flex-wrap:wrap}
.foot{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);font-size:14.5px}
.foot .container{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.foot .logo{color:var(--ink);font-size:18px}
.foot .logo .ic{stroke:var(--accent);width:22px;height:22px}
.foot nav{display:flex;gap:18px}
.foot nav a{color:var(--accent);font-weight:600}

.login-wrap{min-height:100vh;background-color:var(--g900);background-image:radial-gradient(rgba(255,255,255,.08) 1.2px,transparent 1.5px);background-size:26px 26px;display:flex;flex-direction:column;align-items:center;padding:40px 20px}
.login-card{background:var(--surface);color:var(--ink);border-radius:28px;padding:32px;width:100%;max-width:460px;margin-top:34px;box-shadow:0 30px 60px rgba(0,0,0,.3)}
.login-card h1{font-size:36px}
.login-card .sub{color:var(--muted);font-size:17px;margin:6px 0 24px}
.noacct{background:var(--surface2);border-radius:16px;padding:18px;margin-top:22px;font-size:15.5px}
.noacct b{display:block}
.noacct p{color:var(--muted);margin:6px 0 8px}
.noacct .c{font-weight:700;color:var(--ink)}

.lbl{display:block;font-weight:600;font-size:15px;margin-bottom:8px}
.lbl-row{display:flex;justify-content:space-between;align-items:baseline}
.lbl-row a{color:var(--accent);font-weight:600;font-size:15px}
.hint{font-size:13.5px;color:var(--muted);margin-top:6px}
.err{font-size:13.5px;color:var(--red);font-weight:600;margin-top:6px}
.input{width:100%;background:var(--field);color:var(--ink);border:1px solid var(--field-line);border-radius:12px;padding:14px 16px;font:inherit;font-size:16px}
.input::placeholder{color:#8c9a95}
.input:focus{outline:3px solid var(--yellow);outline-offset:1px;border-color:var(--ink)}
textarea.input{min-height:110px;resize:vertical}
.money{position:relative}
.money span{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600;pointer-events:none}
.money .input{padding-left:36px}
.field{margin-bottom:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid var(--field-line);background:var(--field);color:var(--ink);border-radius:999px;padding:10px 18px;font-weight:600;font-size:15px}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--g700);color:#fff;border-color:var(--g700)}

.page{padding:clamp(28px,4vw,44px) 0 72px}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--accent);font-weight:600;font-size:15px;text-decoration:none;margin-bottom:22px}
.back .ic{width:16px;height:16px}
.page h1{font-size:clamp(34px,5vw,48px);letter-spacing:-.02em}
.page .intro{color:var(--muted);font-size:17px;max-width:40em;margin-top:12px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px}
.card h2{font-family:var(--body);font-size:17px;font-weight:700;letter-spacing:0}
.step-h{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.step-h .num{width:30px;height:30px;border-radius:50%;background:var(--mint);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.step-h h2{font-family:var(--body);font-size:17px;font-weight:700}
.split{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:start;margin-top:30px}
.panel-dark{background:var(--g900);color:#fff;border-radius:22px;padding:26px}
.panel-dark h2{font-family:var(--body);font-size:17px;font-weight:700}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sticky{position:sticky;top:16px}

.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px}
.seg button{border:0;background:transparent;color:var(--ink);font-weight:600;font-size:15px;padding:10px 16px;border-radius:10px}
.seg button[aria-pressed="true"]{background:var(--g700);color:#fff}
.eyebrow-s{font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.subline{display:flex;align-items:center;gap:10px;color:var(--muted);flex-wrap:wrap;margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.kpi small{display:block;color:var(--muted);font-size:14.5px}
.kpi b{display:block;font-family:var(--display);font-size:clamp(28px,3vw,36px);font-weight:800;letter-spacing:-.02em;line-height:1.2;margin:2px 0}
.kpi span{font-size:13.5px;color:var(--muted)}
.up{color:var(--accent);font-weight:700}
.down{color:var(--red);font-weight:700}
.dash-main{display:grid;grid-template-columns:1.9fr 1fr;gap:16px;margin-top:16px}
.chart-card{padding:24px 26px}
.chart-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.chart-top small{color:var(--muted);font-size:14px}
.chart-scroll{overflow-x:auto}
.chart-scroll .bars{min-width:420px;gap:clamp(10px,2vw,22px);padding-top:8px}
.chart-scroll .bar-col .v{font-size:13px;color:var(--muted);margin-bottom:8px;white-space:nowrap}
.chart-scroll .bar-col .v.hi{color:var(--ink);font-weight:800}
.chart-scroll .bar-col .m{font-weight:800;margin-top:14px;font-size:15px}
.chart-scroll .bar-col .o{font-size:13px;color:var(--muted);margin-top:8px;white-space:nowrap}
.attn{background:var(--g900);color:#fff;border-radius:22px;padding:26px}
.attn h2{font-family:var(--body);font-size:18px;font-weight:700;margin-bottom:16px}
.attn .it{border-top:1px solid rgba(255,255,255,.16);padding:18px 0 16px}
.attn .it b{display:block;font-size:17px;margin-bottom:6px}
.attn .it p{color:#d3e4de;font-size:15px}
.attn .it a{display:inline-flex;gap:6px;align-items:center;margin-top:12px;color:var(--yellow);font-weight:700;text-underline-offset:4px}
.attn .it a .ic{width:16px;height:16px}
.dash-bottom{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.dash-bottom .card{padding:24px}
.rank{margin-top:16px}
.rank .r{margin-bottom:14px}
.rank .r .rt{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.track{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.track i{display:block;height:100%;background:var(--bar);border-radius:99px}
.track i.hi{background:var(--yellow)}
.ads3{display:grid;grid-template-columns:repeat(3,auto);gap:14px;margin:16px 0 18px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.ads3 small{display:block;color:var(--muted);font-size:13px}
.ads3 b{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.01em}
.cmp{margin-bottom:12px}
.cmp .ct{display:flex;justify-content:space-between;font-weight:600;margin-bottom:6px}
.cmp .red{color:var(--red);font-weight:800}
.card .more{display:inline-flex;gap:6px;align-items:center;margin-top:12px;font-weight:700;color:var(--accent);text-underline-offset:4px}
.card .more .ic{width:16px;height:16px}
table.t{width:100%;border-collapse:collapse;margin-top:14px;font-size:15.5px}
table.t th{font-weight:500;color:var(--muted);text-align:right;padding:8px 6px;font-size:14px}
table.t th:first-child,table.t td:first-child{text-align:left;padding-left:0}
table.t td{text-align:right;padding:13px 6px;border-top:1px solid var(--line)}
table.t tr.tot td{font-weight:800}
.note-bar{background:var(--mint);border-radius:14px;padding:14px 18px;margin-top:16px;font-size:15px}
.preview-bar{background:var(--yellow);color:#1a1405;font-weight:700;padding:10px 0;font-size:15px}
.preview-bar .container{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

.big-roi{font-family:var(--display);font-weight:800;font-size:clamp(64px,9vw,92px);letter-spacing:-.03em;line-height:1;color:var(--yellow);margin:6px 0 14px}
.big-roi.neg{color:#ffb4a0}
.verdict{display:inline-block;background:var(--mint);color:#0a3b32;font-weight:700;font-size:14.5px;padding:7px 14px;border-radius:999px}
.verdict.neg{background:#ffd9cd;color:#6b200a}
.statgrid{display:grid;grid-template-columns:1fr 1fr;margin:22px 0}
.statgrid div{padding:16px 0 16px 18px;border-top:1px solid rgba(255,255,255,.16)}
.statgrid div:nth-child(odd){padding-left:0;padding-right:18px;border-right:1px solid rgba(255,255,255,.16)}
.statgrid small{display:block;color:#cfe0da;font-size:14px}
.statgrid b{font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.01em}
.next-box{background:rgba(255,255,255,.08);border-radius:14px;padding:16px 18px;margin-bottom:18px}
.next-box b{display:block;margin-bottom:4px}
.next-box p{color:#e0ece8;font-size:15.5px}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.formula{list-style:none;margin:14px 0 0;padding:0;font-size:15px}
.formula li{display:flex;gap:14px;margin-bottom:8px}
.formula b{min-width:140px;flex:none}
.formula span{color:var(--muted)}
.saved-list{margin-top:14px}
.saved-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.saved-row small{color:var(--muted);display:block}
.saved-row .x{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:14px}

.bubble{background:#fff;color:#14231f;border-radius:16px;padding:16px 18px;font-size:16px;line-height:1.5;margin:10px 0 12px;white-space:pre-wrap}
.rlabel{color:#cfe0da;font-size:14px;font-weight:600;margin-top:18px}
.nsteps{list-style:none;padding:0;margin:14px 0 0;counter-reset:s}
.nsteps li{display:flex;gap:14px;margin-bottom:14px;counter-increment:s}
.nsteps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--mint);color:var(--accent);font-weight:800;font-size:14px;display:grid;place-items:center;flex:none}
.avoid{background:var(--warn-bg);color:var(--warn-ink);border-radius:16px;padding:16px 18px;display:flex;gap:12px;margin-top:16px;font-size:15.5px}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso = n => (n < 0 ? '−' : '') + '₱' + Math.abs(n).toLocaleString('en-US', {minimumFractionDigits: Number.isInteger(n) ? 0 : 2, maximumFractionDigits: 2});
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? null : n; };

const mem = {};
let DB = null, LIVE = false, CAN_EDIT = false, TOKEN = null;
const API = '/.netlify/functions/api';
try { TOKEN = JSON.parse(localStorage.getItem('bg_token')); } catch (e) {}
async function api(op, body) {
  const r = await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ op, token: TOKEN, ...body }) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && op !== 'login' && TOKEN) { TOKEN = null; store.set('bg_token', null); store.set('bg_session', null); go('#/login'); }
  if (!r.ok) throw new Error(j.error || 'Something went wrong. Try again.');
  return j;
}
const canSave = () => LIVE && TOKEN && session() === 'owner';
async function loadSaved() { if (!canSave()) return; try { const j = await api('sget'); store.set('bg_campaigns', j.campaigns || []); store.set('bg_checks', j.checks || []); } catch (e) {} }
function pushSaved(kind) { if (canSave()) api('sset', { kind, list: store.get(kind === 'checks' ? 'bg_checks' : 'bg_campaigns', []) }).catch(() => toast('Could not save to your account.')); }
async function refresh() { try { const j = await api('list'); mem.bg_biz = j.list; return true; } catch (e) { TOKEN = null; store.set('bg_token', null); return false; } }
const sha = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2, '0')).join('');
const store = {
  get(k, d) { if (k in mem) return mem[k]; try { const v = localStorage.getItem(k); if (v != null) return JSON.parse(v); } catch (e) {} return d; },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} if (k === 'bg_biz' && DB) DB.doc('app/biz').set({ v: JSON.stringify(v) }).catch(() => toast('Could not save. Check your connection and try again.')); }

let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2800);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('Copied'); return; } catch (e) {}
  try {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove();
    toast(ok ? 'Copied' : 'Could not copy. Select the text and copy it yourself.');
  } catch (e) { toast('Could not copy. Select the text and copy it yourself.'); }
}
function openModal(title, body) {
  closeModal();

  m.addEventListener('mousedown', e => { if (e.target === m) closeModal(); });
  document.body.appendChild(m);
  const f = $('input,select,button', m); if (f) f.focus();
  return m;
}

/* ---------- LOGIN ---------- */
function login() {
  app.innerHTML = `<div class="login-wrap">${logoLink()}
  <div class="login-card"><h1>Log in</h1><p class="sub">See how your Grab store is doing.</p>
  <form id="lf" novalidate>
    <div class="field"><label class="lbl" for="lid">Email or mobile number</label>
      <input class="input" id="lid" autocomplete="username" placeholder="e.g. 0917 123 4567"></div>
    <div class="field"><div class="lbl-row"><label class="lbl" for="lpw">Password</label><a href="#/login" data-action="forgot">Forgot password?</a></div>
      <input class="input" id="lpw" type="password" autocomplete="current-password"></div>
    <div class="err" id="lerr" role="alert" hidden></div>
    <button class="btn btn-green btn-block btn-lg" type="submit" style="margin-top:6px">Log in</button>
  </form>
  <div class="noacct"><b>No account yet?</b><p>The BizGuard team creates your account after you share your Grab reports with us.</p>
  <div class="c">Email: ${esc(CONFIG.email)} · Messenger: ${esc(CONFIG.messenger)}</div></div></div></div>`;
  $('#lf').addEventListener('submit', async e => {
    e.preventDefault();
    const id = $('#lid').value.trim(), pw = $('#lpw').value, err = $('#lerr');
    const fail = m => { err.textContent = m; err.hidden = false; };
    if (!id) return fail('Enter your email or mobile number.');
    if (!pw) return fail('Enter your password.');
    let role = 'owner';
    if (LIVE) {
      try { const j = await api('login', { id, pw }); TOKEN = j.token; store.set('bg_token', j.token); role = j.role; if (j.bizId) store.set('bg_owner', j.bizId); await refresh(); }
      catch (e) { return fail(e.message); }
    } else role = /admin/i.test(id) ? 'admin' : 'owner';
    store.set('bg_session', role);
    const next = store.get('bg_next', null); store.set('bg_next', null);
    if (role === 'admin') return go('#/admin');
    go(next && !/admin/.test(next) ? next : '#/dashboard');
  });
}

  const net = v.sales - v.cost - v.spend;
  return {
    ...v, net, roi: net / v.spend * 100, roas: v.sales / v.spend,

    conv: v.inq > 0 && v.orders != null ? v.orders / v.inq * 100 : null

}
function roiNext(r) {

  return 'Pause this ad before you spend more. Check that your price covers your product cost, then try a different offer or audience.';
}

        if (typeof XLSX === 'undefined') throw 0;
        const wb = XLSX.read(new Uint8Array(r.result), { type: 'array', cellDates: true, dateNF: 'yyyy-mm-dd' });
        const sn = wb.SheetNames.find(n => /transaction/i.test(n)) || wb.SheetNames.find(n => { const c = XLSX.utils.sheet_to_csv(wb.Sheets[n]).split('\n')[0].toLowerCase(); return /date|created/.test(c) && /amount|total|sales/.test(c); }) || wb.SheetNames[0];

      const nb = store.get('bg_biz', []).find(x => x.id === ad.sel); ad.file = null; adminList(); adminPanel(); return toast(`Published to ${nb ? nb.name : 'the owner'}'s dashboard`);
    }
    const biz = store.get('bg_biz', BIZ0), b = biz.find(x => x.id === ad.sel);
    if (f.agg) { const d = b.data = b.data || {}, A = f.agg; if (f.type === 'ads') d.ads = A.m; else { d.sales = { months: A.m, weeks: A.w }; d.items = A.it; d.canc = A.c; d.ref = A.r; } }
    b.last = today(); b.status = 'ok';
    store.set('bg_biz', biz); if (ad.sel === 'A') ad.exampleDone = true;
    ad.file = null; adminList(); adminPanel(); toast(`Published to ${b.name}'s dashboard`);
  },
  'up-type'(el) { up.type = el.dataset.t; up.files = []; upPanel(); },
  'up-clear'() { up.files = []; up.rows = false; upPanel(); },
  'up-choose'() { $('#ufin').click(); },
  'up-rows'() { up.rows = !up.rows; upPanel(); },
  async 'up-publish'() {
    const ok = up.files.filter(x => x.res && x.res.agg); if (!ok.length) return;
    try {
      if (up.type === 'ads') { for (const x of ok) await api('publish', { type: 'ads', agg: x.res.agg }); }
      else {
        const all = ok.flatMap(x => x.res.agg.ord);
        if (!all.length) return toast('No orders found in these files.');
        for (let i = 0; i < all.length; i += 20000) await api('publish', { type: 'sales', agg: { m: {}, ord: all.slice(i, i + 20000) } });
      }
      await refresh(); up.files = []; toast(ok.length > 1 ? `${ok.length} files added to your dashboard` : 'Your dashboard is updated'); go('#/dashboard');
    } catch (e) { toast(e.message); }
  },
  async 'up-chpw'() {
    const er = $('#pw-err');
    try { await api('chpw', { old: $('#pw-old').value, pw: $('#pw-new').value }); $('#pw-old').value = $('#pw-new').value = ''; er.hidden = true; toast('Password changed'); } catch (x) { er.textContent = x.message; er.hidden = false; }
  },
  'ad-edit'() {
    const b = store.get('bg_biz', []).find(x => x.id === ad.sel); if (!LIVE || !b) return toast('This needs the server.');
    const o = (v, c) => `<option ${v === c ? 'selected' : ''}>${v}</option>`;
    openModal('Edit business', `<div class="field"><label class="lbl" for="eb-name">Business name</label><input class="input" id="eb-name" value="${esc(b.name)}"></div>
    <div class="field"><label class="lbl" for="eb-login">Owner's email or mobile number</label><input class="input" id="eb-login" value="${esc(b.login || '')}"></div>
    <div class="grid2"><div class="field"><label class="lbl" for="eb-plat">Platform</label><select class="input" id="eb-plat">${o('GrabFood', b.platform)}${o('GrabMart', b.platform)}</select></div>
    <div class="field"><label class="lbl" for="eb-cat">Type</label><select class="input" id="eb-cat">${['Food & beverage', 'Grocery', 'Other'].map(v => `<option ${v === b.cat ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></div></div>
    <div class="err" id="eb-err" hidden></div><div class="row-btns" style="margin-top:12px"><button class="btn btn-green" data-action="ad-edit-save">Save changes</button><button class="btn btn-outline" data-action="modal-close">Cancel</button></div>`);
  },
  async 'ad-edit-save'() {
    const er = $('#eb-err');
    try { await api('edit', { bizId: ad.sel, name: $('#eb-name').value, login: $('#eb-login').value, platform: $('#eb-plat').value, cat: $('#eb-cat').value }); await refresh(); closeModal(); adminList(); adminPanel(); toast('Changes saved'); }
    catch (x) { er.textContent = x.message; er.hidden = false; }
  },
  async 'ad-reset'() {
    if (!LIVE) return toast('This needs the server.');
    const pw = prompt('New password for this owner (at least 6 characters):'); if (!pw) return;
    try { await api('reset', { bizId: ad.sel, pw }); toast('Password changed'); } catch (e) { toast(e.message); }
  },
  async 'ad-del'() {
    if (!LIVE) return toast('This needs the server.');
    if (!confirm('Delete this business and all its data? This cannot be undone.')) return;
    try { await api('del', { bizId: ad.sel }); await refresh(); const l = store.get('bg_biz', []); ad.sel = l[0] ? l[0].id : ''; ad.file = null; adminList(); adminPanel(); toast('Business deleted'); } catch (e) { toast(e.message); }
  },
  'ad-preview'() { go('#/dashboard?preview=' + ad.sel); },
  'ad-add'() {
    openModal('Add business', `<div class="field"><label class="lbl" for="nb-name">Business name</label><input class="input" id="nb-name" placeholder="e.g. Aling Rosa's Carinderia"></div>
    <div class="grid2"><div class="field"><label class="lbl" for="nb-plat">Platform</label><select class="input" id="nb-plat"><option>GrabFood</option><option>GrabMart</option></select></div>
    <div class="field"><label class="lbl" for="nb-cat">Type</label><select class="input" id="nb-cat"><option>Food &amp; beverage</option><option>Grocery</option><option>Other</option></select></div></div>
    <div class="field"><label class="lbl" for="nb-login">Owner's email or mobile number</label><input class="input" id="nb-login" placeholder="e.g. 0917 123 4567" autocomplete="off"></div>
    <div class="field"><label class="lbl" for="nb-pw">Owner's password</label><input class="input" id="nb-pw" autocomplete="off" placeholder="At least 6 characters"><div class="hint">Give this to the owner. They use it to log in.</div></div>
    <div class="err" id="nb-err" hidden></div>
    <div class="row-btns" style="margin-top:12px"><button class="btn btn-green" data-action="ad-add-save">Add business</button><button class="btn btn-outline" data-action="modal-close">Cancel</button></div>`);
  },
  async 'ad-add-save'() {
    const name = $('#nb-name').value.trim(), login = $('#nb-login').value.toLowerCase().replace(/\s+/g, ''), pw = $('#nb-pw').value, er = $('#nb-err');
    const bad = !name ? 'Enter the business name.' : LIVE && !login ? "Enter the owner's email or mobile number." : LIVE && pw.length < 6 ? 'The password needs at least 6 characters.' : LIVE && store.get('bg_biz', BIZ0).some(x => x.login === login) ? 'That email or mobile number is already used.' : '';
    if (bad) { er.textContent = bad; er.hidden = false; return; }
    if (LIVE) {
      try { const j = await api('add', { name, platform: $('#nb-plat').value, cat: $('#nb-cat').value, login, pw }); await refresh(); ad.sel = j.id; }
      catch (e) { er.textContent = e.message; er.hidden = false; return; }
      ad.file = null; closeModal(); adminList(); adminPanel(); toast(`${name} added`); return;
    }
    const biz = store.get('bg_biz', BIZ0); const id = 'N' + Date.now(), salt = id + Math.random().toString(36).slice(2);
    biz.push({ id, name, platform: $('#nb-plat').value, cat: $('#nb-cat').value, last: '—', status: 'none', login, salt, hash: pw ? await sha(salt + pw) : '' });
    store.set('bg_biz', biz); ad.sel = id; ad.file = null; closeModal(); adminList(); adminPanel(); toast(`${name} added`);
  }
};

/* ---------- router ---------- */
const app = $('#app');
let pendingScroll = null;
function parseHash() { const h = location.hash.replace(/^#/, '') || '/'; const [path, qs] = h.split('?'); return { path, q: new URLSearchParams(qs || '') }; }
const PROTECTED = ['/dashboard', '/roi', '/replies', '/creator', '/upload', '/admin'];
const TITLES = { '/': 'BizGuard — see how your Grab store is really doing', '/login': 'Log in · BizGuard', '/dashboard': 'Dashboard · BizGuard', '/roi': 'ROI Calculator · BizGuard', '/replies': 'Complaint Replies · BizGuard', '/creator': 'Creator Checklist · BizGuard', '/admin': 'Owner data · BizGuard', '/upload': 'Upload report · BizGuard' };
function render() {
  const { path, q } = parseHash(), s = session();
  closeModal();
  if (PROTECTED.includes(path) && !s) { store.set('bg_next', location.hash); return go('#/login'); }
  if (path === '/admin' && s !== 'admin') return go('#/dashboard');
  if (path === '/upload' && s === 'admin') return go('#/admin');
  if (path === '/login' && s) return go(s === 'admin' ? '#/admin' : '#/dashboard');
  const routes = { '/': () => { app.innerHTML = landing(); }, '/login': login, '/dashboard': () => dashboard(q), '/roi': roiPage, '/replies': () => repliesPage(q), '/creator': creatorPage, '/upload': uploadPage, '/admin': admin };
  (routes[path] || routes['/'])();
  document.title = TITLES[path] || TITLES['/'];
  if (pendingScroll) { const id = pendingScroll; pendingScroll = null; setTimeout(() => { const el = document.getElementById(id); if (el) el.scrollIntoView(); }, 0); }
  else window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const sc = e.target.closest('[data-scroll]');
  if (sc) {
    e.preventDefault();
    if (parseHash().path !== '/') { pendingScroll = sc.dataset.scroll; go('#/'); }
    else { const el = document.getElementById(sc.dataset.scroll); if (el) el.scrollIntoView({ behavior: 'smooth' }); }
    return;
  }
  const a = e.target.closest('[data-action]');
  if (a && actions[a.dataset.action]) actions[a.dataset.action](a, e);
});
window.addEventListener('hashchange', render);
render();
(async () => {
  try {
    const p = await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{"op":"ping"}' });
    if (!p.ok) return;
    LIVE = true; mem.bg_biz = [];
    if (TOKEN) { if (!await refresh()) store.set('bg_session', null); }
    render();
  } catch (e) {}
})();
</script>
